[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iscreem-api"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.17",
  "redis>=5.2",
  "rq>=2.1",
]

[project.optional-dependencies]
chem = ["rdkit>=2024.3", "meeko>=0.6", "scipy>=1.13", "gemmi>=0.7", "prody>=2.5"]
interaction = ["plip>=2.3"]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real external CLI"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E701", "E702"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
